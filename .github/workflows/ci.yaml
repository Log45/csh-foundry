name: CI
on: [push, pull_request, merge_group, workflow_call, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static checks and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/studio
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: npm run format:check
      - name: Check generated API and SDK contracts against current backend
        run: |
          uv run python scripts/export_openapi.py
          npm run generate:api --prefix apps/studio
          npm run check:generated
          git diff --exit-code -- apps/studio/lib/openapi.json apps/studio/lib/api-schema.ts packages/typescript-sdk/src/schema.ts
  sdk:
    name: SDK regression and consumer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile=artifacts/ci/sdk.xml
      - run: python3 scripts/check_test_report.py artifacts/ci/sdk.xml
      - run: npm run test:consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdk-results
          path: artifacts/ci/
          if-no-files-found: warn
  studio:
    name: Studio component regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
      - run: npm run build -w @foundry/sdk
      - run: npm ci --prefix apps/studio
      - run: npm run format:check --prefix apps/studio
      - run: npm run typecheck --prefix apps/studio
      - run: npm test --prefix apps/studio -- --reporter=default --reporter=junit --outputFile=../../artifacts/ci/studio.xml
      - run: python3 scripts/check_test_report.py artifacts/ci/studio.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-results
          path: artifacts/ci/
          if-no-files-found: warn
  backend:
    name: Backend (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/ci-suite.yaml
    with:
      suite: regression
      shard: ${{ format('{0}/4', matrix.shard) }}
      artifact_suffix: ${{ format('shard-{0}', matrix.shard) }}
  integration:
    name: Regression (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, directory, owner]
    uses: ./.github/workflows/ci-suite.yaml
    with:
      suite: ${{ matrix.suite }}
  regression:
    name: CI / regression
    if: always()
    needs: [static, sdk, studio, backend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every regression job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Regression gate failed: {failed}")
          print("PASS: all required regression jobs succeeded")
          PYCODE
