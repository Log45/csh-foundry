name: Platform and Studio validation
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: foundry
          POSTGRES_DB: foundry_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FOUNDRY_DATABASE_URL: postgresql+psycopg://foundry:${{ github.run_id }}@localhost:5432/foundry_test
      OPEN_ONTOLOGIES_BIN: ${{ github.workspace }}/.external/open-ontologies
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run python scripts/install_semantic_engine.py
      - run: uv run alembic upgrade head
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -q -f integrations/protege/pom.xml compile exec:java '-Dexec.args=fixtures/manufacturing.ttl artifacts/manufacturing.owl'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/studio
      - run: uv run python scripts/validate_phase0.py
      - run: uv run python scripts/export_openapi.py
      - run: npm run generate:api
        working-directory: apps/studio
      - run: git diff --exit-code -- apps/studio/lib/openapi.json apps/studio/lib/api-schema.ts
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: apps/studio
      - run: npx playwright install --with-deps chromium
        working-directory: apps/studio
      - run: uv run python scripts/test_studio.py
