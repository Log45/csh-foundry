name: Extended acceptance
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  storage:
    uses: ./.github/workflows/ci-storage.yaml
  acceptance:
    needs: storage
    strategy:
      fail-fast: false
      matrix:
        suite: [scale, browser-scale, operations]
    uses: ./.github/workflows/ci-suite.yaml
    with:
      suite: ${{ matrix.suite }}
      timeout_minutes: 90
