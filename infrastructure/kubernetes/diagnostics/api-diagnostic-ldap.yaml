apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-diagnostic
  namespace: csh-foundry
  labels:
    app.kubernetes.io/part-of: foundry
spec:
  replicas: 1
  paused: false
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: foundry
    spec:
      serviceAccountName: foundry
      automountServiceAccountToken: false
      # Retain API NetworkPolicy selection without becoming a ready API Service endpoint.
      readinessGates:
        - conditionType: diagnostics.foundry.csh.rit.edu/serve-traffic
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/csh-foundry/foundry-api-diagnostic:ldap
          imagePullPolicy: Always
          command: ["/bin/sleep", "infinity"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
