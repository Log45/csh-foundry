apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: foundry-api-diagnostic
  namespace: csh-foundry
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: foundry-api-diagnostic-ldap
  namespace: csh-foundry
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |
      FROM image-registry.openshift-image-registry.svc:5000/csh-foundry/foundry-api@sha256:7fba8beedc3023ffd55b3624df2adf0e043b7387e61ebf1bb4bf15f5bc1bea35
      USER 0
      RUN apt-get update \
          && apt-get install -y --no-install-recommends ldap-utils \
          && rm -rf /var/lib/apt/lists/*
      USER 10001:10001
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: ImageStreamImage
        name: foundry-api@sha256:7fba8beedc3023ffd55b3624df2adf0e043b7387e61ebf1bb4bf15f5bc1bea35
        namespace: csh-foundry
  output:
    to:
      kind: ImageStreamTag
      name: foundry-api-diagnostic:ldap
  triggers: []
