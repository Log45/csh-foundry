apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio-router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 3000
